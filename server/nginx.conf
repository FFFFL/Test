server {
    listen 8080;
    server_name _;

    location /hls/ {
        root /data/video;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Cache-Control "public, max-age=60";

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
